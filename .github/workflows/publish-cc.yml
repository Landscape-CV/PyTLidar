name: Publish pytlidar-cc to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'cc-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build pytlidar_cc
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cc
          path: pytlidar_cc/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-cc
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
